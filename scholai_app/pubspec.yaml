name: scholai_app
description: Anonymous AI wellness companion for Nigerian university students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google / Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Gemini AI & Live WebSocket
  google_generative_ai: ^0.4.6
  web_socket_channel: ^3.0.1

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation & Launching
  go_router: ^14.3.0
  url_launcher: ^6.3.1

  # Local Storage & Encryption
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # UI
  fl_chart: ^0.69.0           # mood trend charts
  lottie: ^3.1.2              # smooth animations
  google_fonts: ^6.2.1        # typography
  flutter_svg: ^2.0.10+1      # svg icons
  shimmer: ^3.0.0             # loading skeletons

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
