name: scholai_app
description: Anonymous AI wellness companion for Nigerian university students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google / Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2

  # Gemini AI & Live WebSocket
  google_generative_ai: ^0.4.6
  web_socket_channel: ^3.0.1

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation & Launching
  go_router: ^14.3.0
  url_launcher: ^6.3.1

  # Local Storage & Encryption
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  # UI
  fl_chart: ^0.69.0           # mood trend charts
  lottie: ^3.1.2              # smooth animations
  google_fonts: ^6.2.1        # typography
  flutter_svg: ^2.0.10+1      # svg icons
  shimmer: ^3.0.0             # loading skeletons

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Audio (Live sanctuary mic + playback)
  # record ^6.x required: v5 pulls record_linux 0.7.2 which lacks startStream
  # and breaks kernel_snapshot even for Android-only builds.
  audioplayers: ^6.1.0
  record: ^6.2.1

  # Config
  flutter_dotenv: ^6.0.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.0
  connectivity_plus: ^6.0.5
  http: ^1.6.0
  speech_to_text: ^7.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  mocktail: ^1.0.4
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/scholai_launcher.png
  adaptive_icon_background: "#1C1612"
  adaptive_icon_foreground: assets/icons/scholai_launcher_foreground.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#1C1612"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/animations/
    - assets/icons/

