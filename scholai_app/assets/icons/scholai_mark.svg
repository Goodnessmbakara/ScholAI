<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="terracottaRibbon" x1="120" y1="80" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4845A"/>
      <stop offset="45%" stop-color="#B85C38"/>
      <stop offset="100%" stop-color="#8C3D20"/>
    </linearGradient>
    <linearGradient id="innerEmber" x1="256" y1="140" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E59866"/>
      <stop offset="100%" stop-color="#C05C33"/>
